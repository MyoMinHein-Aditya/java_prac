<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Login Page</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 40px;
        }
        .box {
            width: 320px;
            margin: 40px auto;
            background-color: #ffffff;
            border: 1px solid #cccccc;
            padding: 20px;
        }
        h2 {
            text-align: center;
            color: #333333;
            margin-top: 0;
        }
        .form-group {
            margin-bottom: 12px;
        }
        label {
            display: block;
            margin-bottom: 4px;
            font-weight: bold;
        }
        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 6px;
            border: 1px solid #999999;
            box-sizing: border-box;
        }
        input[type="submit"] {
            width: 100%;
            padding: 8px;
            background-color: #0066cc;
            color: #ffffff;
            border: 1px solid #0055aa;
            cursor: pointer;
            font-size: 14px;
        }
        .links {
            margin-top: 15px;
            text-align: center;
            font-size: 13px;
        }
        .links a {
            color: #0066cc;
            text-decoration: none;
        }
    </style>
</head>
<body>
<div class="box">
    <h2>User Login</h2>
    <form action="MainApp" method="POST">
        <div class="form-group">
            <label>Username:</label>
            <input type="text" name="user" required>
        </div>
        <div class="form-group">
            <label>Password:</label>
            <input type="password" name="pass" required>
        </div>
        <input type="submit" value="Login">
    </form>
    <div class="links">
        <p>New user? <a href="Register.html">Register here</a></p>
        <hr>
        <p><b>Other Demos:</b></p>
        <p>
            <a href="hello">Hello World</a> |
            <a href="request-details">Request Details</a> |
            <a href="session">Session Tracking</a>
        </p>
    </div>
</div>
</body>
</html>
