<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        body {
            background: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            width: 350px;
            background: #fff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
        }
        h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #333;
        }
        .input-group {
            margin-bottom: 15px;
        }
        .input-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        .input-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        .options {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            font-size: 14px;
        }
        .options a {
            text-decoration: none;
            color: blue;
        }
        button {
            width: 100%;
            padding: 10px;
            background: #007BFF;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background: #0056b3;
        }
        .footer {
            text-align: center;
            margin-top: 15px;
        }
        .register-btn {
            margin-top: 10px;
            background: #28a745;
        }
        .register-btn:hover {
            background: #1e7e34;
        }
        .nav-links {
            margin-top: 15px;
            text-align: center;
            font-size: 13px;
        }
        .nav-links a {
            color: #007BFF;
            text-decoration: none;
            margin: 0 5px;
        }
    </style>
</head>
<body>
<div class="container">
    <h2>Login</h2>
    <form action="MainApp" method="POST">
        <div class="input-group">
            <label>Username</label>
            <input type="text" name="user" required>
        </div>
        <div class="input-group">
            <label>Password</label>
            <input type="password" name="pass" required>
        </div>
        <div class="options">
            <label>
                <input type="checkbox"> Remember Me
            </label>
            <a href="#">Forgot Password?</a>
        </div>
        <button type="submit">Login</button>
    </form>
    <div class="footer">
        <p>Don't have an account?</p>
        <button type="button" class="register-btn" onclick="window.location.href='Register.html'">
            Register
        </button>
    </div>
    <div class="nav-links">
        <hr style="margin: 10px 0;">
        <p><b>Other Practical 3 Demos:</b></p>
        <a href="hello">Hello World</a> |
        <a href="request-details">Request Details</a> |
        <a href="session">Session Tracking</a>
    </div>
</div>
</body>
</html>
