<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spring Boot CRUD</title>
<style>
    body {
        font-family: Arial, sans-serif;
        margin: 40px;
        background-color: #f4f4f4;
    }
    .box {
        background-color: #ffffff;
        padding: 20px;
        border: 1px solid #cccccc;
        max-width: 650px;
        margin: auto;
    }
    h1 { color: #333333; font-size: 22px; margin-top: 0; }
    h2 { color: #555555; font-size: 16px; margin-top: 20px; }
    input[type=text] {
        padding: 6px;
        border: 1px solid #999999;
        margin-right: 5px;
    }
    button {
        padding: 6px 12px;
        background-color: #0066cc;
        color: #ffffff;
        border: 1px solid #0055aa;
        cursor: pointer;
    }
    table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 15px;
    }
    th, td {
        border: 1px solid #999999;
        padding: 6px 10px;
        text-align: left;
    }
    th {
        background-color: #eeeeee;
    }
    .status {
        margin-top: 15px;
        padding: 6px 10px;
        background-color: #eeeeee;
        border: 1px solid #cccccc;
        font-size: 13px;
    }
</style>
</head>
<body>
<div class="box">
    <h1>Spring Boot CRUD Application</h1>
    <p>Student: <b>Kalpataru Dash</b> | Port: <b>8082</b></p>
    <hr>

    <h2>Add New Employee</h2>
    <input type="text" id="postName" placeholder="Employee Name">
    <input type="text" id="postCity" placeholder="City">
    <button onclick="saveEmployee()">Save</button>

    <h2>All Employee Records</h2>
    <div id="tableContainer">Loading records...</div>

    <div class="status" id="statusMsg">Ready</div>
</div>

<script>
    // Fetch and display all employees in HTML table
    async function loadEmployees() {
        const res = await fetch('/employee/all');
        const data = await res.json();

        let table = '<table><tr><th>ID</th><th>Name</th><th>City</th><th>Action</th></tr>';
        if (data.length === 0) {
            table += '<tr><td colspan="4" style="text-align:center;">No records found</td></tr>';
        } else {
            data.forEach(e => {
                table += `<tr>
                    <td>${e.id}</td>
                    <td>${e.name}</td>
                    <td>${e.city}</td>
                    <td>
                        <button style="background-color:#dc3545;" onclick="deleteEmployee(${e.id})">Delete</button>
                    </td>
                </tr>`;
            });
        }
        table += '</table>';
        document.getElementById('tableContainer').innerHTML = table;
        document.getElementById('statusMsg').innerText = 'Loaded ' + data.length + ' employee record(s).';
    }

    // Add new employee
    async function saveEmployee() {
        const name = document.getElementById('postName').value.trim();
        const city = document.getElementById('postCity').value.trim();
        if (!name || !city) {
            alert('Please enter both Name and City');
            return;
        }

        const res = await fetch('/employee/save', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name, city })
        });
        const saved = await res.json();
        document.getElementById('postName').value = '';
        document.getElementById('postCity').value = '';
        document.getElementById('statusMsg').innerText = 'Employee added successfully with ID: ' + saved.id;
        loadEmployees();
    }

    // Delete employee by ID
    async function deleteEmployee(id) {
        if (!confirm('Are you sure you want to delete employee ID ' + id + '?')) return;
        const res = await fetch('/employee/delete/' + id, { method: 'DELETE' });
        const text = await res.text();
        document.getElementById('statusMsg').innerText = text;
        loadEmployees();
    }

    // Load table on page startup
    window.onload = loadEmployees;
</script>
</body>
</html>
