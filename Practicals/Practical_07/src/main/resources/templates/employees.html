<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Employee Management</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 40px;
        }
        .box {
            background-color: #ffffff;
            border: 1px solid #cccccc;
            padding: 20px;
            width: 500px;
        }
        h1 {
            color: #333333;
            font-size: 22px;
            margin-top: 0;
        }
        h2 {
            color: #555555;
            font-size: 16px;
            margin-top: 20px;
        }
        .form-group {
            margin-bottom: 10px;
        }
        label {
            display: inline-block;
            width: 60px;
            font-weight: bold;
        }
        input[type="text"] {
            padding: 5px;
            border: 1px solid #999999;
            width: 200px;
        }
        input[type="submit"] {
            padding: 6px 12px;
            background-color: #0066cc;
            color: #ffffff;
            border: 1px solid #0055aa;
            cursor: pointer;
        }
        table {
            border-collapse: collapse;
            width: 100%;
            margin-top: 15px;
        }
        th, td {
            border: 1px solid #999999;
            padding: 6px 10px;
            text-align: left;
        }
        th {
            background-color: #eeeeee;
        }
        .del-link {
            color: #cc0000;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="box">
        <h1>Employee Management System</h1>
        <p>Student: <b>Kalpataru Dash</b> | Port: <b>8083</b></p>
        <hr>

        <h2>Add Employee</h2>
        <form action="/save" method="post">
            <div class="form-group">
                <label>Name:</label>
                <input type="text" name="name" required>
            </div>
            <div class="form-group">
                <label>City:</label>
                <input type="text" name="city" required>
            </div>
            <input type="submit" value="Save Employee">
        </form>

        <h2>Employee Records</h2>
        <table>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>City</th>
                <th>Action</th>
            </tr>
            <tr th:each="employee : ${employees}">
                <td th:text="${employee.id}">1</td>
                <td th:text="${employee.name}">Anitha Nadar</td>
                <td th:text="${employee.city}">Vadodara</td>
                <td>
                    <a class="del-link" th:href="@{'/delete/' + ${employee.id}}">Delete</a>
                </td>
            </tr>
        </table>
    </div>
</body>
</html>
