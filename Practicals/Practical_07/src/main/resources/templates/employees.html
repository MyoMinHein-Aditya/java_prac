<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Employee Management</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background-color: #fdfdfd;
        }
        h1 {
            color: #222;
        }
        h2 {
            color: #444;
            margin-top: 25px;
        }
        form {
            background-color: #f7f9fa;
            padding: 20px;
            border-radius: 6px;
            max-width: 400px;
            border: 1px solid #e0e0e0;
        }
        label {
            font-weight: bold;
            display: inline-block;
            width: 60px;
        }
        input[type="text"] {
            padding: 6px 10px;
            width: 260px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button[type="submit"] {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        button[type="submit"]:hover {
            background-color: #0056b3;
        }
        table {
            border-collapse: collapse;
            width: 500px;
            margin-top: 15px;
        }
        th, td {
            border: 1px solid #666;
            padding: 8px 12px;
            text-align: left;
        }
        th {
            background-color: #eee;
        }
        .del-link {
            color: #dc3545;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h1>Employee Management System</h1>

    <h2>Add Employee</h2>
    <form action="/save" method="post">
        <label>Name:</label>
        <input type="text" name="name" placeholder="e.g. Anitha Nadar" required>
        <br><br>
        <label>City:</label>
        <input type="text" name="city" placeholder="e.g. Vadodara" required>
        <br><br>
        <button type="submit">Save Employee</button>
    </form>

    <hr style="margin-top: 30px;">

    <h2>Employee Records</h2>
    <table>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>City</th>
            <th>Action</th>
        </tr>
        <tr th:each="employee : ${employees}">
            <td th:text="${employee.id}">1</td>
            <td th:text="${employee.name}">Anitha Nadar</td>
            <td th:text="${employee.city}">Vadodara</td>
            <td>
                <a class="del-link" th:href="@{'/delete/' + ${employee.id}}">Delete</a>
            </td>
        </tr>
    </table>
</body>
</html>
