<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>JSP JDBC Login</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            margin: 50px;
        }
        .container {
            width: 350px;
            margin: 0 auto;
            background: #ffffff;
            padding: 25px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
        }
        label {
            font-weight: bold;
            display: block;
            margin-top: 10px;
        }
        input[type=text],
        input[type=password] {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        input[type=submit] {
            width: 100%;
            padding: 10px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 15px;
        }
        input[type=submit]:hover {
            background-color: #0056b3;
        }
        .footer {
            text-align: center;
            margin-top: 15px;
            font-size: 13px;
            color: #666;
        }
        .extra-links {
            width: 450px;
            margin: 25px auto;
            background: #ffffff;
            padding: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
            text-align: center;
            font-size: 14px;
        }
        .extra-links a {
            color: #007bff;
            text-decoration: none;
            margin: 0 5px;
        }
        .extra-links a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
<div class="container">
    <h2>User Login</h2>
    <form action="Request.jsp" method="post">
        <label>Username</label>
        <input type="text" name="user" placeholder="Enter Username (e.g. admin)" required>
        <label>Password</label>
        <input type="password" name="pass" placeholder="Enter Password (e.g. 1234)" required>
        <input type="submit" value="Login">
    </form>
    <div class="footer">
        JSP • JDBC • MySQL Login System
    </div>
</div>

<div class="extra-links">
    <p><b>Practical 4 Additional Programs:</b></p>
    <p style="margin-top: 8px;">
        <a href="practical_4_1_arithmetic.jsp">4.1 Arithmetic JSP</a> |
        <a href="forward_demo.jsp">jsp:forward Tag</a> |
        <a href="implicit_objects.jsp">Implicit Objects</a> |
        <a href="insert_user.jsp">Insert New User</a>
    </p>
</div>
</body>
</html>
